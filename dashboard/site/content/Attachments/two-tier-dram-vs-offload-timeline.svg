<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1d2330">
  <rect width="1120" height="560" fill="#ffffff"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#f87171" stroke-width="3"/></pattern>
    <marker id="dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
  </defs>

  <!-- ===== Part 1: existing offload ===== -->
  <text x="30" y="32" font-size="16" font-weight="700">现有 KV 卸载：搬运只发生在请求边界</text>
  <text x="30" y="52" font-size="12.5" fill="#6b7280">一个请求的生命周期（R3：R1 的下一轮）</text>
  <text x="140" y="86" text-anchor="end" fill="#6b7280">请求</text>
  <text x="140" y="128" text-anchor="end" fill="#6b7280">G1 ⇄ G2 链路</text>

  <rect x="150" y="68" width="70" height="28" rx="4" fill="#e5e7eb"/><text x="185" y="87" text-anchor="middle" font-size="12">到达·查 G2</text>
  <rect x="220" y="68" width="150" height="28" rx="4" fill="#fde68a"/><text x="295" y="87" text-anchor="middle" font-size="12">等 H2D（未准入）</text>
  <line x1="370" y1="62" x2="370" y2="102" stroke="#1d2330" stroke-width="1.5"/><text x="370" y="58" text-anchor="middle" font-size="11.5">准入</text>
  <rect x="370" y="68" width="110" height="28" rx="4" fill="#4f7cff"/><text x="425" y="87" text-anchor="middle" font-size="12" fill="#fff">prefill</text>
  <g fill="#93c5fd">
    <rect x="484" y="68" width="40" height="28" rx="3"/><rect x="528" y="68" width="40" height="28" rx="3"/><rect x="572" y="68" width="40" height="28" rx="3"/>
    <rect x="616" y="68" width="40" height="28" rx="3"/><rect x="660" y="68" width="40" height="28" rx="3"/><rect x="704" y="68" width="40" height="28" rx="3"/>
  </g>
  <text x="614" y="87" text-anchor="middle" font-size="12">decode step × N（KV 全在 G1）</text>
  <text x="760" y="87" font-size="12">… 完成</text>

  <rect x="220" y="112" width="150" height="26" rx="4" fill="#f08a24"/><text x="295" y="130" text-anchor="middle" font-size="12" fill="#fff">H2D：整段前缀，所有层</text>
  <rect x="480" y="112" width="160" height="26" rx="4" fill="#21a179"/><text x="560" y="130" text-anchor="middle" font-size="12" fill="#fff">D2H store（后台）</text>
  <text x="660" y="130" font-size="12" fill="#6b7280">decode 期间链路空闲：不访问 G2</text>

  <text x="30" y="170" font-size="12.5" fill="#6b7280">每个请求最多一次 H2D、一次 D2H；搬运量大，但不在 decode 的逐步关键路径上。</text>

  <line x1="20" y1="190" x2="1100" y2="190" stroke="#e5e7eb"/>

  <!-- ===== Part 2: two-tier DRAM ===== -->
  <text x="30" y="222" font-size="16" font-weight="700">两级 DRAM：搬运发生在每个 decode step 的每一层</text>
  <text x="30" y="242" font-size="12.5" fill="#6b7280">放大一个 decode step 中的第 L、L+1 层（方案 A：逐层预取 ＋ 热 KV 缓存）</text>

  <text x="140" y="280" text-anchor="end" fill="#6b7280">计算</text>
  <text x="140" y="330" text-anchor="end" fill="#6b7280">共享链路</text>
  <text x="140" y="384" text-anchor="end" fill="#6b7280">一级占用</text>

  <!-- compute lane layer L -->
  <rect x="150" y="262" width="80" height="28" rx="4" fill="#c4b5fd"/><text x="190" y="281" text-anchor="middle" font-size="12">indexer L</text>
  <rect x="230" y="262" width="50" height="28" rx="4" fill="#a78bfa"/><text x="255" y="281" text-anchor="middle" font-size="12" fill="#fff">top-k</text>
  <rect x="280" y="262" width="70" height="28" rx="4" fill="url(#hatch)" stroke="#f87171"/><text x="315" y="281" text-anchor="middle" font-size="11.5" fill="#991b1b">等缺失 KV</text>
  <rect x="350" y="262" width="120" height="28" rx="4" fill="#4f7cff"/><text x="410" y="281" text-anchor="middle" font-size="12" fill="#fff">attention L</text>
  <rect x="470" y="262" width="140" height="28" rx="4" fill="#f59e0b"/><text x="540" y="281" text-anchor="middle" font-size="12" fill="#fff">MoE L</text>
  <!-- layer L+1 (hit) -->
  <rect x="620" y="262" width="80" height="28" rx="4" fill="#c4b5fd"/><text x="660" y="281" text-anchor="middle" font-size="12">indexer L+1</text>
  <rect x="700" y="262" width="50" height="28" rx="4" fill="#a78bfa"/><text x="725" y="281" text-anchor="middle" font-size="12" fill="#fff">top-k</text>
  <rect x="750" y="262" width="120" height="28" rx="4" fill="#4f7cff"/><text x="810" y="281" text-anchor="middle" font-size="12" fill="#fff">attention L+1</text>
  <rect x="870" y="262" width="140" height="28" rx="4" fill="#f59e0b"/><text x="940" y="281" text-anchor="middle" font-size="12" fill="#fff">MoE L+1</text>
  <text x="1020" y="281" font-size="12">… 所有层</text>
  <text x="810" y="304" text-anchor="middle" font-size="11" fill="#047857">top-k 全部命中热 KV，不等待</text>

  <!-- link lane -->
  <rect x="150" y="314" width="130" height="26" rx="4" fill="#fdba74"/><text x="215" y="331" text-anchor="middle" font-size="11.5">预取 L+1 层</text>
  <rect x="280" y="314" width="70" height="26" rx="4" fill="#d64545"/><text x="315" y="331" text-anchor="middle" font-size="11.5" fill="#fff">按需取 KV</text>
  <rect x="350" y="314" width="210" height="26" rx="4" fill="#fdba74"/><text x="455" y="331" text-anchor="middle" font-size="11.5">预取继续（按需读取时暂停）</text>
  <rect x="610" y="314" width="40" height="26" rx="4" fill="#21a179"/><text x="630" y="331" text-anchor="middle" font-size="11" fill="#fff">写回</text>
  <rect x="650" y="314" width="300" height="26" rx="4" fill="#fdba74"/><text x="800" y="331" text-anchor="middle" font-size="11.5">预取 L+2 层的权重与 indexer KV</text>
  <rect x="1010" y="314" width="40" height="26" rx="4" fill="#21a179"/><text x="1030" y="331" text-anchor="middle" font-size="11" fill="#fff">写回</text>

  <!-- dependencies -->
  <line x1="350" y1="314" x2="350" y2="294" stroke="#d64545" stroke-width="1.8" marker-end="url(#dep)"/>
  <path d="M560 327 C 590 327, 600 300, 618 292" fill="none" stroke="#d64545" stroke-width="1.8" marker-end="url(#dep)"/>
  <text x="566" y="356" font-size="11" fill="#991b1b">L+1 权重到达后才能开始</text>

  <!-- tier-1 occupancy strip at layer L -->
  <rect x="150" y="368" width="138" height="26" fill="#f08a24"/><text x="219" y="385" text-anchor="middle" font-size="11.5" fill="#fff">当前层权重</text>
  <rect x="288" y="368" width="110" height="26" fill="#fdba74"/><text x="343" y="385" text-anchor="middle" font-size="11.5">L+1 预取缓冲</text>
  <rect x="398" y="368" width="54" height="26" fill="#a78bfa"/><text x="425" y="385" text-anchor="middle" font-size="11" fill="#fff">idx KV</text>
  <rect x="452" y="368" width="110" height="26" fill="#4f7cff"/><text x="507" y="385" text-anchor="middle" font-size="11.5" fill="#fff">热 KV 缓存</text>
  <rect x="562" y="368" width="54" height="26" fill="#9ca3af"/><text x="589" y="385" text-anchor="middle" font-size="11" fill="#fff">scratch</text>
  <rect x="150" y="368" width="560" height="26" fill="none" stroke="#1d2330" stroke-dasharray="4 3"/>
  <text x="716" y="385" font-size="11.5" fill="#6b7280">← 虚线框 = 一级容量；各用途互相挤占</text>

  <text x="30" y="430" font-size="12.5" fill="#6b7280">一个 decode step 要把这个过程对所有层重复一遍；一个请求有成百上千个 step。每次搬运量小而分散，却在关键路径上。</text>

  <line x1="20" y1="452" x2="1100" y2="452" stroke="#e5e7eb"/>
  <g font-size="12" fill="#6b7280">
    <rect x="30" y="472" width="14" height="12" fill="#f08a24"/><text x="50" y="483">H2D / 权重</text>
    <rect x="130" y="472" width="14" height="12" fill="#fdba74"/><text x="150" y="483">预取</text>
    <rect x="200" y="472" width="14" height="12" fill="#d64545"/><text x="220" y="483">按需取入</text>
    <rect x="294" y="472" width="14" height="12" fill="#21a179"/><text x="314" y="483">D2H / 写回</text>
    <rect x="394" y="472" width="14" height="12" fill="url(#hatch)" stroke="#f87171"/><text x="414" y="483">计算等待数据</text>
    <text x="30" y="512">示意图：时间长度不代表实测耗时。现有卸载一侧对应 AISim 代码行为；两级 DRAM 一侧是设计目标，AISim 尚未实现。</text>
  </g>
</svg>
