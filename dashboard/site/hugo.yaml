baseurl: "/"
locale: "en-US"
timeZone: "Asia/Shanghai"
title: "Mirage"
theme: "Research-Project-Homepage"
ignoreFiles: ["(^|/)\\.workspace-trash/", "\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.excalidraw\\.md$", "(^|/)Templates/", "(^|/)Attachments/"]
footnotereturnlinkcontents: "↩"
defaultContentLanguage: "en"
hasCJKLanguage: true
buildFuture: true
buildDrafts: false
cascade:
  - draft: true
    content_lang: en
enableRobotsTXT: true
disableKinds: [taxonomy, term]

frontmatter:
  date: [date]
  lastmod: [lastmod, ":fileModTime", ":default"]

module:
  mounts:
    - source: static
      target: static
    - source: content/Attachments
      target: static/attachments
      files: ["! **.md", "! **.markdown"]
    - source: content/Excalidraw
      target: static/excalidraw
      files: ["**.svg"]

outputs:
  home: [html, rss, json]

menu:
  main:
    - name: Overview
      url: /
      weight: 10
    - name: Related
      pageRef: /related-work
      weight: 20
    - name: Research
      pageRef: /research-journey
      weight: 30
    - name: Docs
      pageRef: /system-implementation
      weight: 40
    - name: Meetings
      pageRef: /meetings
      weight: 50

params:
  source_repository: "https://github.com/L1NxFR/Mirage"
  journal_sections: [related-work, research-journey, system-implementation, meetings]
  description: "Mirage — an LLM serving simulator."
  toc_threshold: 3
  author:
    default: "Nan Lin"
    cn: ""
  logo:
    en:
      alt: Mirage
      url: /
      img: # a path to the logo
  footer: "Mirage · {Year}"

security:
  allowContent: ['.*']

markup:
  highlight:
    codeFences: true
    noClasses: false
    lineNos: false
  goldmark:
    extensions:
      extras:
        mark:
          enable: true
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
