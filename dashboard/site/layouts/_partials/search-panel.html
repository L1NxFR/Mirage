<div class="site-search" data-index-url="{{ "index.json" | relURL }}">
  <label class="search-label" for="{{ .id }}">关键词</label>
  <input id="{{ .id }}" type="search" autocomplete="off" placeholder="搜索文章、主题或章节…" aria-describedby="{{ .id }}-help" aria-controls="{{ .id }}-results">
  <p class="search-help" id="{{ .id }}-help">支持中英文搜索。空格分隔表示同时匹配：<code>GPU 通信</code>；用 <code>|</code> 匹配任意词：<code>AllReduce | AllGather</code>；用双引号精确匹配短语：<code>"集合通信"</code>。必要时可尝试更短的关键词或常用缩写。</p>
  <p class="search-status" role="status" aria-live="polite">输入关键词搜索文章和章节。</p>
  <div class="search-results" id="{{ .id }}-results"></div>
  <noscript>启用 JavaScript 后即可搜索，也可通过上方导航浏览文档。</noscript>
</div>
